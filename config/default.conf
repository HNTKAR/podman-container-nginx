server {
    listen       80 default_server;
    #listen       unix:/run/podman/port8080_tcp.sock default_server;
    server_name  _;

    location / {
        root /usr/local/share/sites/user;
        index index.html;
    }

    error_page  404              /404.html;

    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   /usr/share/nginx/html;
    }
}
